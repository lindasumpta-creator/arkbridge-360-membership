<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arkbridge 360 Membership</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7fb;color:#152033}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#102a43,#1f6f8b)}
.card{background:#fff;border-radius:20px;box-shadow:0 14px 45px #0003;padding:24px;width:min(430px,100%)}
h1,h2,h3{margin-top:0}
.brand{font-weight:800;font-size:24px}
.muted{color:#6b7280}
.field{margin:14px 0}
.field label{display:block;font-weight:650;margin-bottom:7px}
.field input{width:100%;padding:13px;border:1px solid #d6dce5;border-radius:10px}
.primary{width:100%;padding:13px;border:0;border-radius:10px;background:#126782;color:white;font-weight:750}
.error{color:#b42318;background:#fff0f0;padding:10px;border-radius:9px;margin:12px 0}
.shell{display:flex;min-height:100vh}
.side{width:240px;background:#102a43;color:#fff;padding:20px;position:fixed;inset:0 auto 0 0}
.side .brand{margin-bottom:25px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#dbeafe;padding:12px;border-radius:9px;margin:3px 0}
.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}
.main{margin-left:240px;width:calc(100% - 240px);padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.logout{border:1px solid #d6dce5;background:#fff;padding:9px 12px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:#fff;padding:18px;border-radius:15px;box-shadow:0 3px 12px #0000000b}
.stat b{font-size:27px;display:block;margin-top:6px}
.panel{background:#fff;border-radius:15px;padding:18px;margin-top:16px;box-shadow:0 3px 12px #0000000b}
.search{display:flex;gap:9px;margin-bottom:14px}
.search input{flex:1;padding:11px;border:1px solid #d6dce5;border-radius:9px}
.tablewrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:600px}
.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf6f8}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#152033;color:#fff;padding:12px 16px;border-radius:10px;z-index:10;max-width:90%}

@media(max-width:760px){
.side{width:76px;padding:12px 8px}
.side .brand span,.nav button span{display:none}
.nav button{text-align:center;font-size:20px}
.main{margin-left:76px;width:calc(100% - 76px);padding:14px}
.grid{grid-template-columns:repeat(2,1fr)}
.top h2{font-size:20px}
.card{padding:20px}
}

@media(max-width:420px){
.grid{grid-template-columns:1fr}
.main{padding:10px}
}
</style>
</head>

<body>

<div id="root"></div>
<div id="toast" class="toast hidden"></div>

<script>

const SUPABASE_URL='https://ijcipmdvzhpfzmublwky.supabase.co';
const SUPABASE_KEY='sb_publishable_7vJ5i4UwsVR-fU3HWjVapg_YQ53B8HB';

const client=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

let currentPage='dashboard';

const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  "'":'&#39;',
  '"':'&quot;'
}[c]));

function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),3000);
}

function login(){

  const root=document.getElementById('root');

  root.innerHTML=`
    <div class="login">
      <div class="card">

        <div class="brand">Arkbridge 360</div>

        <p class="muted">
          Membership & Staff Management
        </p>

        <div id="loginErr"></div>

        <form id="loginForm">

          <div class="field">
            <label>Email</label>
            <input
              id="email"
              type="email"
              autocomplete="username"
              required
            >
          </div>

          <div class="field">
            <label>Password</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button
            class="primary"
            id="loginBtn"
            type="submit"
          >
            Sign in
          </button>

        </form>

      </div>
    </div>
  `;

  document.getElementById('loginForm').onsubmit=async e=>{

    e.preventDefault();

    const b=document.getElementById('loginBtn');

    b.disabled=true;
    b.textContent='Signing in…';

    document.getElementById('loginErr').innerHTML='';

    const {error}=await client.auth.signInWithPassword({
      email:document.getElementById('email').value.trim(),
      password:document.getElementById('password').value
    });

    if(error){

      document.getElementById('loginErr').innerHTML=
        '<div class="error">'+esc(error.message)+'</div>';

      b.disabled=false;
      b.textContent='Sign in';

      return;
    }

    await renderApp();
  };
}

async function renderApp(){

  const root=document.getElementById('root');

  root.innerHTML=`

    <div class="shell">

      <aside class="side">

        <div class="brand">
          A<span>rkbridge 360</span>
        </div>

        <nav class="nav">

          <button data-p="dashboard">
            🏠 <span>Dashboard</span>
          </button>

          <button data-p="members">
            👥 <span>Members</span>
          </button>

          <button data-p="add-member">
            ➕ <span>Add Member</span>
          </button>

          <button data-p="staff">
            👔 <span>Staff</span>
          </button>

          <button data-p="cards">
            💳 <span>Cards</span>
          </button>

          <button data-p="verify">
            🔎 <span>Verify</span>
          </button>

          <button data-p="audit">
            📋 <span>Audit</span>
          </button>

        </nav>

      </aside>

      <main class="main">

        <div class="top">

          <h2 id="title">
            Dashboard
          </h2>

          <button
            class="logout"
            id="logout"
          >
            Sign out
          </button>

        </div>

        <section id="content"></section>

      </main>

    </div>
  `;

  document.querySelectorAll('[data-p]').forEach(b=>{

    b.onclick=()=>{

      currentPage=b.dataset.p;

      loadPage();

    };

  });

  document.getElementById('logout').onclick=async()=>{

    await client.auth.signOut();

    login();

  };

  loadPage();
}

async function rpc(name,args={}){

  const {data,error}=await client.rpc(name,args);

  if(error)throw error;

  return data;
}

async function loadPage(){

  document
    .querySelectorAll('[data-p]')
    .forEach(b=>
      b.classList.toggle(
        'active',
        b.dataset.p===currentPage
      )
    );

  document.getElementById('title').textContent=
    currentPage[0].toUpperCase()+currentPage.slice(1);

  const c=document.getElementById('content');

  c.innerHTML=
    '<div class="panel">Loading…</div>';

  try{

    if(currentPage==='dashboard')
      return dashboard(c);

    if(currentPage==='add-member')
      return addMemberPage(c);

    if(currentPage==='members')
      return list(
        c,
        'Members',
        'search_members',
        'p_query',
        'p_limit',
        [
          'membership_number',
          'first_name',
          'last_name',
          'email',
          'phone',
          'status'
        ]
      );

    if(currentPage==='staff')
      return list(
        c,
        'Staff',
        'search_staff',
        'p_query',
        'p_limit',
        [
          'staff_id',
          'first_name',
          'last_name',
          'email',
          'department',
          'role',
          'status'
        ]
      );

    if(currentPage==='cards')
      return list(
        c,
        'Membership Cards',
        'search_cards',
        'p_query',
        'p_limit',
        [
          'card_number',
          'membership_number',
          'first_name',
          'last_name',
          'status',
          'issue_date',
          'expiry_date'
        ]
      );

    if(currentPage==='verify')
      return verifyPage(c);

    if(currentPage==='audit')
      return audit(c);

  }catch(e){

    c.innerHTML=
      '<div class="panel error">'+
      esc(e.message||String(e))+
      '</div>';

  }
}

async function dashboard(c){

  let d=await rpc('dashboard_stats');

  d=Array.isArray(d)?d[0]:d||{};

  c.innerHTML=

    '<div class="grid">'+

    [
      ['Members',d.total_members],
      ['Active Members',d.active_members],
      ['Cards',d.total_cards],
      ['Staff',d.total_staff],
      ['Active Cards',d.active_cards],
      ['Today Verifications',d.today_verifications],
      ['Failed Today',d.today_failed],
      ['Pending Members',d.pending_members]
    ]

    .map(x=>

      `<div class="stat">
        <span class="muted">${esc(x[0])}</span>
        <b>${esc(x[1]??0)}</b>
      </div>`

    ).join('')+

    '</div>'+

    `<div class="panel">
      <h3>Welcome</h3>
      <p class="muted">
        Arkbridge 360 membership management is connected to Supabase.
      </p>
    </div>`;
}

async function list(
  c,
  title,
  fn,
  qarg,
  larg,
  cols
){

  c.innerHTML=`

    <div class="panel">

      <div class="search">

        <input
          id="q"
          placeholder="Search ${title.toLowerCase()}…"
        >

        <button
          class="primary"
          style="width:auto;padding:10px 16px"
          id="go"
        >
          Search
        </button>

      </div>

      <div id="results" class="muted">
        Enter a search term.
      </div>

    </div>
  `;

  async function run(){

    const q=document.getElementById('q').value.trim();

    document.getElementById('results').innerHTML=
      'Loading…';

    try{

      const rows=await rpc(
        fn,
        {
          [qarg]:q,
          [larg]:50
        }
      );

      document.getElementById('results').innerHTML=
        table(rows,cols);

    }catch(e){

      document.getElementById('results').innerHTML=
        '<div class="error">'+
        esc(e.message)+
        '</div>';

    }
  }

  document.getElementById('go').onclick=run;

  document.getElementById('q').onkeydown=e=>{

    if(e.key==='Enter')
      run();

  };
}
  async function addMemberPage(c){

  c.innerHTML=`

    <div class="panel">

      <h3>Add New Member</h3>

      <form id="memberForm">

        <div class="field">
          <label>First Name</label>
          <input id="first_name" required>
        </div>

        <div class="field">
          <label>Last Name</label>
          <input id="last_name" required>
        </div>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email">
        </div>

        <div class="field">
          <label>Phone</label>
          <input id="phone">
        </div>

        <div class="field">
          <label>Date of Birth</label>
          <input id="date_of_birth" type="date">
        </div>

        <button class="primary" id="saveMember">
          Save Member
        </button>

      </form>

      <div id="memberMsg"></div>

    </div>
  `;

  document.getElementById('memberForm').onsubmit=async e=>{

    e.preventDefault();

    const b=document.getElementById('saveMember');
    const msg=document.getElementById('memberMsg');

    b.disabled=true;
    b.textContent='Saving…';
    msg.innerHTML='';

    const args={
      p_first_name:document.getElementById('first_name').value.trim(),
      p_last_name:document.getElementById('last_name').value.trim(),
      p_email:document.getElementById('email').value.trim()||null,
      p_phone:document.getElementById('phone').value.trim()||null,
      p_date_of_birth:document.getElementById('date_of_birth').value||null
    };

    try{

      const result=await rpc(
        'create_member_and_issue_card',
        args
      );

      msg.innerHTML=
        '<div class="panel">'+
        '<strong>Member created successfully.</strong>'+
        '<pre style="white-space:pre-wrap">'+
        esc(JSON.stringify(result,null,2))+
        '</pre>'+
        '</div>';

      document.getElementById('memberForm').reset();

    }catch(e){

      msg.innerHTML=
        '<div class="error">'+
        esc(e.message||String(e))+
        '</div>';

    }

    b.disabled=false;
    b.textContent='Save Member';

  };
}

function table(rows,cols){

  if(!rows||!rows.length)
    return '<div class="muted">No records found.</div>';

  return `

    <div class="tablewrap">

      <table class="table">

        <thead>
          <tr>
            ${cols.map(c=>`<th>${esc(c.replaceAll('_',' '))}</th>`).join('')}
          </tr>
        </thead>

        <tbody>

          ${rows.map(r=>`

            <tr>

              ${cols.map(c=>`

                <td>

                  ${
                    c==='status'
                    ? `<span class="pill">${esc(r[c])}</span>`
                    : esc(r[c])
                  }

                </td>

              `).join('')}

            </tr>

          `).join('')}

        </tbody>

      </table>

    </div>
  `;
}

async function verifyPage(c){

  c.innerHTML=`

    <div class="panel">

      <h3>Verify Membership</h3>

      <p class="muted">
        Enter a membership number or card number.
      </p>

      <div class="search">

        <input
          id="verifyInput"
          placeholder="Membership or card number"
        >

        <button
          class="primary"
          style="width:auto;padding:10px 16px"
          id="verifyBtn"
        >
          Verify
        </button>

      </div>

      <div id="verifyResult"></div>

    </div>
  `;

  async function verify(){

    const value=
      document.getElementById('verifyInput')
      .value.trim();

    if(!value){

      document.getElementById('verifyResult').innerHTML=
        '<div class="error">Enter a membership or card number.</div>';

      return;
    }

    const out=document.getElementById('verifyResult');

    out.innerHTML='Checking…';

    try{

      const result=await rpc(
        'verify_membership',
        {
          p_identifier:value
        }
      );

      out.innerHTML=`

        <div class="panel">

          <h3>Verification Result</h3>

          <pre style="white-space:pre-wrap;overflow:auto">${esc(
            JSON.stringify(result,null,2)
          )}</pre>

        </div>

      `;

    }catch(e){

      out.innerHTML=
        '<div class="error">'+
        esc(e.message||String(e))+
        '</div>';

    }
  }

  document.getElementById('verifyBtn').onclick=verify;

  document.getElementById('verifyInput').onkeydown=e=>{

    if(e.key==='Enter')
      verify();

  };
}

async function audit(c){

  c.innerHTML=`

    <div class="panel">

      <h3>Audit Log</h3>

      <div id="auditResults">
        Loading…
      </div>

    </div>
  `;

  try{

    const rows=await rpc(
      'get_audit_log',
      {
        p_limit:100
      }
    );

    document.getElementById('auditResults').innerHTML=
      table(
        rows,
        [
          'created_at',
          'action',
          'actor_email',
          'details'
        ]
      );

  }catch(e){

    document.getElementById('auditResults').innerHTML=
      '<div class="error">'+
      esc(e.message||String(e))+
      '</div>';

  }
}

client.auth.onAuthStateChange(
  async(event,session)=>{

    if(session){

      if(document.getElementById('root').querySelector('.login'))
        await renderApp();

    }else{

      login();

    }

  }
);

(async()=>{

  const {
    data:{
      session
    }
  }=await client.auth.getSession();

  if(session)
    await renderApp();
  else
    login();

})();

</script>

</body>
</html>
