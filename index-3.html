<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arkbridge 360 Membership</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#182230}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd3dd}button{cursor:pointer;background:#182230;color:white}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:white;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.hidden{display:none}.error{color:#b42318;margin-top:10px}.ok{color:#067647}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}h1,h2{margin-top:0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}@media(max-width:600px){.wrap{padding:12px}.card{padding:15px}}</style></head><body><div class="wrap"><div id="login" class="card"><h1>Arkbridge 360</h1><p>Membership & Staff Management</p><input id="email" type="email" placeholder="Email" autocomplete="username"><br><br><input id="password" type="password" placeholder="Password" autocomplete="current-password"><br><br><button id="loginBtn">Login</button><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="card"><div class="row"><div><h1>Arkbridge 360</h1><small id="who"></small></div><button id="logout">Logout</button></div></div><div class="nav"><button data-page="dashboard">Dashboard</button><button data-page="members">Members</button><button data-page="staff">Staff</button><button data-page="cards">Cards</button><button data-page="verify">Verify</button><button data-page="audit">Audit</button></div><main id="content"></main></div></div><script>const URL='https://ijcipmdvzhpfzmublwky.supabase.co';const KEY='sb_publishable_7vJ5i4UwsVR-fU3HWjVapg_YQ53B8HB';const sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);function msg(t,ok=false){$('loginMsg').className=ok?'ok':'error';$('loginMsg').textContent=t}async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)showApp(session);sb.auth.onAuthStateChange((e,s)=>{if(s)showApp(s);else showLogin()})}function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}function showApp(s){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=s.user.email||'';page('dashboard')}$('loginBtn').onclick=async()=>{msg('Signing in…',true);$('loginBtn').disabled=true;try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!data.session)throw new Error('Login did not create a session.');showApp(data.session)}catch(e){msg(e.message||'Unable to sign in');}finally{$('loginBtn').disabled=false}};$('logout').onclick=()=>sb.auth.signOut();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));async function rpc(name,args={}){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}async function page(p){const c=$('content');c.innerHTML='<div class="card">Loading…</div>';try{if(p==='dashboard'){let d=await rpc('dashboard_stats');c.innerHTML='<div class="grid">'+Object.entries(d||{}).map(([k,v])=>`<div class="card"><b>${k.replaceAll('_',' ')}</b><h2>${v??0}</h2></div>`).join('')+'</div>'}else if(p==='members')await searchPage(c,'Members','search_members','p_query');else if(p==='staff')await searchPage(c,'Staff','search_staff','p_query');else if(p==='cards')await searchPage(c,'Cards','search_cards','p_query');else if(p==='verify'){c.innerHTML='<div class="card"><h2>Verify identifier</h2><div class="row"><input id="ident" placeholder="Membership, card or staff ID"><button id="verifyBtn">Verify</button></div><pre id="vr"></pre></div>';$('verifyBtn').onclick=async()=>{try{$('vr').textContent=JSON.stringify(await rpc('verify_identifier',{p_identifier:$('ident').value.trim()}),null,2)}catch(e){$('vr').textContent=e.message}}}else if(p==='audit'){let d=await rpc('recent_audit_activity');c.innerHTML='<div class="card"><h2>Audit</h2><pre>'+JSON.stringify(d||[],null,2)+'</pre></div>'}}catch(e){c.innerHTML='<div class="card"><b>Unable to load</b><p>'+e.message+'</p></div>'}}async function searchPage(c,title,fn,arg){c.innerHTML=`<div class="card"><h2>${title}</h2><div class="row"><input id="q" placeholder="Search ${title.toLowerCase()}"><button id="go">Search</button></div><pre id="res">Enter a search.</pre></div>`;$('go').onclick=async()=>{try{$('res').textContent=JSON.stringify(await rpc(fn,{[arg]:$('q').value.trim(),p_limit:25}),null,2)}catch(e){$('res').textContent=e.message}}}boot();</script></body></html>
