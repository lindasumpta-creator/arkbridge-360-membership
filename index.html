<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arkbridge 360 Membership</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7fb;color:#152033}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#102a43,#1f6f8b)}
.card{background:#fff;border-radius:20px;box-shadow:0 14px 45px #0003;padding:24px;width:min(430px,100%)}
h1,h2,h3{margin-top:0}.brand{font-weight:800;font-size:24px}.muted{color:#6b7280}
.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #d6dce5;border-radius:10px;background:#fff}
.field textarea{min-height:90px;resize:vertical}
.primary{width:100%;padding:13px;border:0;border-radius:10px;background:#126782;color:white;font-weight:750}
.secondary{padding:11px 15px;border:1px solid #d6dce5;border-radius:10px;background:#fff;font-weight:650}
.error{color:#b42318;background:#fff0f0;padding:10px;border-radius:9px;margin:12px 0}
.success{color:#087443;background:#edfdf3;padding:12px;border-radius:9px;margin:12px 0}
.shell{display:flex;min-height:100vh}.side{width:240px;background:#102a43;color:#fff;padding:20px;position:fixed;inset:0 auto 0 0}
.side .brand{margin-bottom:25px}.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#dbeafe;padding:12px;border-radius:9px;margin:3px 0}
.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}
.main{margin-left:240px;width:calc(100% - 240px);padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.logout{border:1px solid #d6dce5;background:#fff;padding:9px 12px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:#fff;padding:18px;border-radius:15px;box-shadow:0 3px 12px #0000000b}.stat b{font-size:27px;display:block;margin-top:6px}
.panel{background:#fff;border-radius:15px;padding:18px;margin-top:16px;box-shadow:0 3px 12px #0000000b}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}.full{grid-column:1/-1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.search{display:flex;gap:9px;margin-bottom:14px}.search input{flex:1;padding:11px;border:1px solid #d6dce5;border-radius:9px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:600px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf6f8}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#152033;color:#fff;padding:12px 16px;border-radius:10px;z-index:10;max-width:90%}
@media(max-width:760px){
.side{width:76px;padding:12px 8px}.side .brand span,.nav button span{display:none}.nav button{text-align:center;font-size:20px}
.main{margin-left:76px;width:calc(100% - 76px);padding:14px}.grid{grid-template-columns:repeat(2,1fr)}
.top h2{font-size:20px}.card{padding:20px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}
}
@media(max-width:420px){.grid{grid-template-columns:1fr}.main{padding:10px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL='https://ijcipmdvzhpfzmublwky.supabase.co';
const SUPABASE_KEY='sb_publishable_7vJ5i4UwsVR-fU3HWjVapg_YQ53B8HB';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

let currentPage='dashboard';

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
}[c]));

function toast(message){
  const t=$('toast'); t.textContent=message; t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),3000);
}

async function rpc(name,args={}){
  const {data,error}=await client.rpc(name,args);
  if(error) throw error;
  return data;
}

function login(){
  $('root').innerHTML=`
    <div class="login">
      <div class="card">
        <div class="brand">Arkbridge 360</div>
        <p class="muted">Membership & Staff Management</p>
        <div id="loginErr"></div>
        <form id="loginForm">
          <div class="field">
            <label>Email</label>
            <input id="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="primary" id="loginBtn">Sign in</button>
        </form>
      </div>
    </div>`;
  $('loginForm').onsubmit=async e=>{
    e.preventDefault();
    const b=$('loginBtn'); b.disabled=true; b.textContent='Signing in…'; $('loginErr').innerHTML='';
    const {error}=await client.auth.signInWithPassword({
      email:$('email').value.trim(),password:$('password').value
    });
    if(error){
      $('loginErr').innerHTML='<div class="error">'+esc(error.message)+'</div>';
      b.disabled=false;b.textContent='Sign in';return;
    }
    await renderApp();
  };
}

async function renderApp(){
  $('root').innerHTML=`
    <div class="shell">
      <aside class="side">
        <div class="brand">A<span>rkbridge 360</span></div>
        <nav class="nav">
          <button data-p="dashboard">🏠 <span>Dashboard</span></button>
          <button data-p="members">👥 <span>Members</span></button>
          <button data-p="staff">👔 <span>Staff</span></button>
          <button data-p="cards">💳 <span>Cards</span></button>
          <button data-p="verify">🔎 <span>Verify</span></button>
          <button data-p="audit">📋 <span>Audit</span></button>
        </nav>
      </aside>
      <main class="main">
        <div class="top"><h2 id="title">Dashboard</h2><button class="logout" id="logout">Sign out</button></div>
        <section id="content"></section>
      </main>
    </div>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    currentPage=b.dataset.p;loadPage();
  });
  $('logout').onclick=async()=>{await client.auth.signOut();login()};
  loadPage();
}

async function loadPage(){
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===currentPage));
  $('title').textContent=currentPage[0].toUpperCase()+currentPage.slice(1);
  const c=$('content'); c.innerHTML='<div class="panel">Loading…</div>';
  try{
    if(currentPage==='dashboard')return dashboard(c);
    if(currentPage==='members')return membersPage(c);
    if(currentPage==='staff')return list(c,'Staff','search_staff','p_query','p_limit',['staff_id','first_name','last_name','email','department','role','status']);
    if(currentPage==='cards')return list(c,'Membership Cards','search_cards','p_query','p_limit',['card_number','membership_number','first_name','last_name','status','issue_date','expiry_date']);
    if(currentPage==='verify')return verifyPage(c);
    if(currentPage==='audit')return audit(c);
  }catch(e){c.innerHTML='<div class="panel error">'+esc(e.message||String(e))+'</div>'}
}

async function dashboard(c){
  let d=await rpc('dashboard_stats'); d=Array.isArray(d)?d[0]:d||{};
  c.innerHTML='<div class="grid">'+[
    ['Members',d.total_members],['Active Members',d.active_members],['Cards',d.total_cards],['Staff',d.total_staff],
    ['Active Cards',d.active_cards],['Today Verifications',d.today_verifications],['Failed Today',d.today_failed],['Pending Members',d.pending_members]
  ].map(x=>`<div class="stat"><span class="muted">${esc(x[0])}</span><b>${esc(x[1]??0)}</b></div>`).join('')+
  '</div><div class="panel"><h3>Welcome</h3><p class="muted">Arkbridge 360 membership management is connected to Supabase.</p></div>';
}

function membersPage(c){
  c.innerHTML=`
    <div class="panel">
      <div class="actions">
        <button class="primary" style="width:auto" id="addMemberBtn">➕ Add Member</button>
        <button class="secondary" id="searchMembersBtn">🔎 Search Members</button>
      </div>
      <div id="memberArea"></div>
    </div>`;
  $('addMemberBtn').onclick=()=>showMemberForm();
  $('searchMembersBtn').onclick=()=>showMemberSearch();
  showMemberSearch();
}

function showMemberSearch(){
  const area=$('memberArea');
  area.innerHTML=`
    <div class="panel">
      <h3>Search Members</h3>
      <div class="search">
        <input id="q" placeholder="Search membership number, name, email or phone…">
        <button class="primary" style="width:auto;padding:10px 16px" id="go">Search</button>
      </div>
      <div id="results" class="muted">Enter a search term.</div>
    </div>`;
  async function run(){
    const q=$('q').value.trim(); $('results').innerHTML='Loading…';
    try{
      const rows=await rpc('search_members',{p_query:q,p_limit:50});
      $('results').innerHTML=table(rows,['membership_number','first_name','last_name','email','phone','status']);
    }catch(e){$('results').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
  }
  $('go').onclick=run; $('q').onkeydown=e=>{if(e.key==='Enter')run()};
}

function showMemberForm(){
  const area=$('memberArea');
  area.innerHTML=`
    <div class="panel">
      <h3>Add New Member</h3>
      <p class="muted">Leave membership and card numbers blank to generate them automatically.</p>
      <form id="memberForm">
        <div class="formgrid">
          <div class="field"><label>Membership Number</label><input id="membership_number" placeholder="Automatic"></div>
          <div class="field"><label>First Name *</label><input id="first_name" required></div>
          <div class="field"><label>Last Name *</label><input id="last_name" required></div>
          <div class="field"><label>Middle Name</label><input id="middle_name"></div>
          <div class="field"><label>Email</label><input id="member_email" type="email"></div>
          <div class="field"><label>Phone</label><input id="member_phone" type="tel"></div>
          <div class="field"><label>Date of Birth</label><input id="date_of_birth" type="date"></div>
          <div class="field"><label>Joined Date</label><input id="joined_at" type="date"></div>
          <div class="field full"><label>Address</label><textarea id="address"></textarea></div>
          <div class="field full"><label>Notes</label><textarea id="notes"></textarea></div>
          <div class="field"><label>Issue Membership Card</label>
            <select id="issue_card"><option value="yes">Yes</option><option value="no">No</option></select>
          </div>
          <div class="field"><label>Card Number</label><input id="card_number" placeholder="Automatic if card is issued"></div>
          <div class="field"><label>Card Issue Date</label><input id="issue_date" type="date"></div>
          <div class="field"><label>Card Expiry Date</label><input id="expiry_date" type="date"></div>
        </div>
        <div id="formMsg"></div>
        <div class="actions">
          <button class="primary" style="width:auto" id="saveMember">Save Member</button>
          <button type="button" class="secondary" id="cancelMember">Cancel</button>
        </div>
      </form>
    </div>`;
  const today=new Date().toISOString().slice(0,10);
  $('joined_at').value=today; $('issue_date').value=today;
  const expiry=new Date(); expiry.setFullYear(expiry.getFullYear()+1);
  $('expiry_date').value=expiry.toISOString().slice(0,10);
  $('cancelMember').onclick=showMemberSearch;
  $('memberForm').onsubmit=saveMember;
}

async function saveMember(e){
  e.preventDefault();
  const btn=$('saveMember'); btn.disabled=true; btn.textContent='Saving…'; $('formMsg').innerHTML='';
  try{
    const issue=$('issue_card').value==='yes';
    let membership=$('membership_number').value.trim();
    if(!membership) membership=await rpc('generate_membership_number');
    let card='';
    if(issue){
      card=$('card_number').value.trim();
      if(!card) card=await rpc('generate_card_number');
    }
    const result=await rpc('create_member_and_issue_card',{
      p_membership_number:membership,
      p_first_name:$('first_name').value.trim(),
      p_last_name:$('last_name').value.trim(),
      p_middle_name:$('middle_name').value.trim()||null,
      p_email:$('member_email').value.trim()||null,
      p_phone:$('member_phone').value.trim()||null,
      p_date_of_birth:$('date_of_birth').value||null,
      p_address:$('address').value.trim()||null,
      p_photo_url:null,
      p_joined_at:$('joined_at').value||null,
      p_notes:$('notes').value.trim()||null,
      p_card_number:card||null,
      p_issue_date:issue?$('issue_date').value:null,
      p_expiry_date:issue?$('expiry_date').value:null,
      p_card_photo_url:null,
      p_card_data:issue?{source:'Arkbridge 360 web app'}:{}
    });
    $('formMsg').innerHTML='<div class="success"><b>Member created successfully.</b><br>Membership: '+esc(membership)+(issue?'<br>Card: '+esc(card):'')+'</div>';
    toast('Member created successfully');
    $('memberForm').reset();
    $('joined_at').value=today; $('issue_date').value=today; $('expiry_date').value=expiry.toISOString().slice(0,10);
  }catch(e){
    $('formMsg').innerHTML='<div class="error">'+esc(e.message||String(e))+'</div>';
  }finally{btn.disabled=false;btn.textContent='Save Member'}
}

async function list(c,title,fn,qarg,larg,cols){
  c.innerHTML=`<div class="panel"><div class="search"><input id="q" placeholder="Search ${title.toLowerCase()}…"><button class="primary" style="width:auto;padding:10px 16px" id="go">Search</button></div><div id="results" class="muted">Enter a search term.</div></div>`;
  async function run(){
    const q=$('q').value.trim(); $('results').innerHTML='Loading…';
    try{const rows=await rpc(fn,{[qarg]:q,[larg]:50});$('results').innerHTML=table(rows,cols)}
    catch(e){$('results').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
  }
  $('go').onclick=run;$('q').onkeydown=e=>{if(e.key==='Enter')run()};
}

function table(rows,cols){
  if(!rows||!rows.length)return '<p class="muted">No records found.</p>';
  return '<div class="tablewrap"><table class="table"><thead><tr>'+
    cols.map(x=>'<th>'+esc(x.replaceAll('_',' '))+'</th>').join('')+
    '</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+cols.map(x=>'<td>'+esc(r[x])+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';
}

function verifyPage(c){
  c.innerHTML='<div class="panel"><h3>Verify membership, card or staff ID</h3><div class="search"><input id="idq" placeholder="MBR-…, CARD-…, or STAFF-…"><button class="primary" style="width:auto;padding:10px 16px" id="verifyBtn">Verify</button></div><div id="vr"></div></div>';
  $('verifyBtn').onclick=async()=>{
    const q=$('idq').value.trim();if(!q)return;
    $('vr').innerHTML='Checking…';
    try{
      const d=await rpc('verify_identifier',{p_identifier:q});
      $('vr').innerHTML='<div class="panel"><h3>'+esc(d.valid?'VALID':'NOT VALID')+'</h3><p><b>Result:</b> '+esc(d.result)+'</p><p><b>Name:</b> '+esc(d.name)+'</p><p><b>Type:</b> '+esc(d.identifier_type)+'</p><p><b>Status:</b> '+esc(d.status)+'</p></div>';
    }catch(e){$('vr').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
  };
}

async function audit(c){
  const rows=await rpc('recent_audit_activity');
  c.innerHTML='<div class="panel">'+table(rows,['action','table_name','record_id','created_at'])+'</div>';
}

client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')login()});

(async()=>{
  const {data}=await client.auth.getSession();
  if(data.session)renderApp();else login();
})();
</script>
</body>
</html>
