<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Arkbridge 360 Membership</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --orange: #e85d04;
      --black: #111111;
      --white: #ffffff;
      --light: #f3f4f6;
      --border: #dddddd;
      --green: #16803c;
      --red: #c62828;
      --muted: #666666;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--black);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      max-width: 100%;
    }

    img {
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .center {
      text-align: center;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        linear-gradient(
          135deg,
          #111111 0%,
          #222222 55%,
          #e85d04 100%
        );
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 55px rgba(0,0,0,.28);
    }

    .logo-text {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .ab,
    .gtl {
      color: #111111;
    }

    .three-sixty {
      color: var(--orange);
    }

    .login-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 25px;
    }

    /* =========================
       COMMON
    ========================= */

    label {
      display: block;
      font-weight: 800;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 9px;
      outline: none;
      background: #ffffff;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(232,93,4,.12);
    }

    .form-group {
      margin-bottom: 16px;
      min-width: 0;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 800;
      max-width: 100%;
    }

    .btn-primary {
      background: var(--orange);
      color: #ffffff;
    }

    .btn-dark {
      background: #111111;
      color: #ffffff;
    }

    .btn-light {
      background: #e9e9e9;
      color: #111111;
    }

    .btn-success {
      background: var(--green);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--red);
      color: #ffffff;
    }

    .btn-small {
      padding: 8px 11px;
      font-size: 12px;
    }

    .full {
      width: 100%;
    }

    .message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #ffe7e7;
      color: #a00000;
    }

    .message.success {
      display: block;
      background: #e8f8ed;
      color: #12642e;
    }

    .notice {
      width: 100%;
      background: #fff2e8;
      border-left: 4px solid var(--orange);
      padding: 13px;
      border-radius: 7px;
      margin-bottom: 18px;
      overflow-wrap: anywhere;
    }

    /* =========================
       APP
    ========================= */

    #appScreen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .topbar {
      width: 100%;
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-logo {
      min-width: 0;
      flex: 1 1 auto;
      font-size: 23px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-btn {
      display: none;
      border: none;
      background: #111111;
      color: #ffffff;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 800;
    }

    .layout {
      width: 100%;
      min-width: 0;
      display: flex;
      min-height: calc(100vh - 64px);
      min-height: calc(100dvh - 64px);
    }

    .sidebar {
      width: 240px;
      background: #111111;
      padding: 15px 12px;
      flex: 0 0 240px;
    }

    .nav-btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      background: transparent;
      color: #ffffff;
      text-align: left;
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      font-weight: 800;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--orange);
    }

    .main {
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      padding: 22px;
      margin: 0;
      overflow-x: hidden;
    }

    .page-content {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .page-title {
      margin: 0 0 6px;
      font-size: 29px;
      line-height: 1.2;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .page-subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      text-align: center;
      overflow-wrap: anywhere;
    }

    .panel {
      width: 100%;
      min-width: 0;
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      margin: 0 auto 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .panel h2 {
      text-align: center;
      margin-top: 0;
    }

    .form-grid {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 15px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    .actions .btn {
      max-width: 100%;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .stats-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #ffffff;
      border-radius: 13px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666666;
      font-weight: 700;
      font-size: 13px;
    }

    /* =========================
       PHOTO
    ========================= */

    .photo-preview-wrap {
      width: 100%;
      margin-top: 14px;
      text-align: center;
    }

    .photo-preview-frame {
      width: 100%;
      min-height: 170px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border: 1px dashed #cccccc;
      border-radius: 10px;
    }

    .photo-preview {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      border: 3px solid #111111;
      border-radius: 8px;
      display: none;
      margin: 0 auto;
    }

    .photo-status {
      margin-top: 9px;
      color: #147333;
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    /* =========================
       SUCCESS
    ========================= */

    .success-box {
      width: 100%;
      background: #effaf2;
      border: 1px solid #bde5c7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .success-title {
      color: #147333;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 12px;
      text-align: center;
    }

    .success-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .success-item {
      min-width: 0;
      background: #ffffff;
      padding: 10px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .success-label {
      color: #777777;
      font-size: 11px;
      text-transform: uppercase;
    }

    .success-value {
      font-weight: 800;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #eeeeee;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f7f7f7;
      font-size: 13px;
    }

    td {
      font-size: 13px;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: var(--green);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .member-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    /* =========================
       EDIT
    ========================= */

    .edit-box {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .edit-photo-frame {
      width: 100%;
      min-height: 170px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border: 1px dashed #cccccc;
      border-radius: 10px;
    }

    .edit-photo {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      border: 3px solid #111111;
      border-radius: 9px;
      display: block;
    }

    /* =========================
       ID CARD
    ========================= */

    .id-card-container {
      width: 100%;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0 30px;
      overflow: hidden;
    }

    .member-id-card {
      width: 760px;
      max-width: 100%;
      aspect-ratio: 1 / 1.52;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid #111111;
      box-shadow: 0 18px 45px rgba(0,0,0,.18);
      position: relative;
      text-align: center;
      flex: 0 1 760px;
    }

    .card-orange-top {
      height: 28px;
      background: var(--orange);
    }

    .card-logo-area {
      padding: 22px 15px 5px;
    }

    .card-logo {
      font-size: 52px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: 1px;
    }

    .card-main-title {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 900;
    }

    .card-subtitle {
      font-size: 14px;
      font-weight: 700;
      color: #555555;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .card-photo-area {
      margin: 18px auto 10px;
      width: 300px;
      height: 300px;
      max-width: 70%;
      aspect-ratio: 1 / 1;
      border: 5px solid var(--orange);
      border-radius: 14px;
      overflow: hidden;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777777;
      font-weight: 800;
    }

    .card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .card-member-name {
      font-size: 25px;
      font-weight: 1000;
      margin: 15px 12px 10px;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .card-details {
      width: 80%;
      max-width: 590px;
      margin: auto;
    }

    .card-detail {
      display: grid;
      grid-template-columns: 1fr auto 1.5fr;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #cccccc;
      text-align: left;
      font-size: 16px;
      min-width: 0;
    }

    .card-detail-label,
    .card-detail-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .card-detail-label {
      font-weight: 800;
    }

    .card-detail-colon {
      font-weight: 900;
    }

    .card-detail-value {
      font-weight: 800;
    }

    .active-badge {
      display: inline-block;
      background: var(--green);
      color: #ffffff;
      padding: 5px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .card-qr {
      width: 75px;
      height: 75px;
      margin: 14px auto 8px;
      border: 1px solid #dddddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #777777;
    }

    .card-tagline {
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 800;
      margin: 8px 10px 14px;
      overflow-wrap: anywhere;
    }

    .card-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 75px;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
    }

    .card-bottom::before {
      content: "";
      position: absolute;
      top: -25px;
      left: -5%;
      width: 110%;
      height: 45px;
      background: var(--orange);
      border-radius: 50%;
    }

    .card-bottom-name {
      position: relative;
      z-index: 2;
      margin-top: 18px;
      font-size: 17px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .card-bottom-small {
      position: relative;
      z-index: 2;
      font-size: 11px;
      margin-top: 3px;
    }

    /* =========================
       STAFF
    ========================= */

    .staff-card {
      background: #ffffff;
      border-radius: 13px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      margin-bottom: 15px;
      text-align: center;
    }

    .staff-name {
      font-size: 20px;
      font-weight: 900;
    }

    .staff-role {
      color: var(--orange);
      font-weight: 900;
      margin-top: 4px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      #loginScreen {
        padding: 14px;
      }

      .login-box {
        padding: 24px 18px;
        border-radius: 16px;
      }

      .logo-text {
        font-size: 34px;
      }

      .topbar {
        height: 60px;
        min-height: 60px;
        padding: 0 10px;
        gap: 7px;
      }

      .topbar-logo {
        font-size: 16px;
        line-height: 1.1;
      }

      .topbar-actions {
        gap: 5px;
      }

      .menu-btn {
        display: inline-block;
        padding: 8px 9px;
        font-size: 12px;
        white-space: nowrap;
      }

      .topbar .btn-dark {
        padding: 8px 9px;
        font-size: 12px;
        white-space: nowrap;
      }

      .layout {
        display: block;
        width: 100%;
        min-width: 0;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 60px;
        bottom: 0;
        width: 250px;
        max-width: 82vw;
        height: calc(100vh - 60px);
        height: calc(100dvh - 60px);
        z-index: 90;
        transform: translateX(-105%);
        transition: transform .2s ease;
        overflow-y: auto;
        box-shadow: 8px 0 25px rgba(0,0,0,.25);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 16px 10px 30px;
        margin: 0;
        overflow-x: hidden;
      }

      .page-content {
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
      }

      .page-title {
        font-size: 24px;
        text-align: center;
      }

      .page-subtitle {
        text-align: center;
        font-size: 14px;
        line-height: 1.4;
      }

      .panel {
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        margin-left: 0;
        margin-right: 0;
      }

      .panel h2 {
        font-size: 19px;
        text-align: center;
      }

      .form-grid {
        grid-template-columns: minmax(0,1fr);
        gap: 12px;
      }

      .full-width {
        grid-column: auto;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 10px;
      }

      .stat-card {
        padding: 15px 8px;
      }

      .stat-number {
        font-size: 25px;
      }

      .success-grid {
        grid-template-columns: minmax(0,1fr);
      }

      .actions {
        flex-direction: column;
        width: 100%;
      }

      .actions .btn {
        width: 100%;
        max-width: 420px;
      }

      .id-card-container {
        width: 100%;
        padding: 12px 0 24px;
        justify-content: center;
        align-items: center;
      }

      .member-id-card {
        width: min(100%, 360px);
        max-width: 360px;
        flex: 0 1 360px;
        border-radius: 14px;
      }

      .card-orange-top {
        height: 13px;
      }

      .card-logo-area {
        padding: 13px 8px 3px;
      }

      .card-logo {
        font-size: 31px;
        letter-spacing: .5px;
      }

      .card-main-title {
        margin-top: 6px;
        font-size: 17px;
      }

      .card-subtitle {
        font-size: 8px;
        margin-top: 3px;
        letter-spacing: .7px;
      }

      .card-photo-area {
        width: 180px;
        height: 180px;
        max-width: 62%;
        margin-top: 9px;
        margin-bottom: 6px;
        border-width: 3px;
        border-radius: 9px;
      }

      .card-member-name {
        font-size: 14px;
        line-height: 1.15;
        margin: 7px 8px 5px;
      }

      .card-details {
        width: 86%;
        max-width: none;
      }

      .card-detail {
        grid-template-columns: minmax(0,1fr) auto minmax(0,1.25fr);
        font-size: 8px;
        gap: 4px;
        padding: 4px 0;
      }

      .active-badge {
        padding: 3px 7px;
        font-size: 7px;
      }

      .card-qr {
        width: 38px;
        height: 38px;
        margin: 4px auto;
        font-size: 7px;
      }

      .card-tagline {
        font-size: 5px;
        letter-spacing: 1px;
        margin: 4px 5px 5px;
      }

      .card-bottom {
        height: 38px;
      }

      .card-bottom::before {
        top: -13px;
        height: 23px;
      }

      .card-bottom-name {
        font-size: 7px;
        margin-top: 8px;
      }

      .card-bottom-small {
        font-size: 5px;
        margin-top: 1px;
      }

      table {
        min-width: 900px;
      }
    }

    @media (max-width: 380px) {

      .topbar {
        padding: 0 7px;
      }

      .topbar-logo {
        font-size: 14px;
      }

      .menu-btn,
      .topbar .btn-dark {
        padding: 7px 8px;
        font-size: 11px;
      }

      .main {
        padding-left: 7px;
        padding-right: 7px;
      }

      .panel {
        padding: 12px;
      }

      .member-id-card {
        width: min(100%, 330px);
        max-width: 330px;
        flex-basis: 330px;
      }

      .card-photo-area {
        width: 155px;
        height: 155px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================= -->

  <section id="loginScreen">

    <div class="login-box">

      <div class="logo-text">
        <span class="ab">AB</span><span class="three-sixty">360</span><span class="gtl">GTL</span>
      </div>

      <div class="login-title">
        Arkbridge 360 Membership
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="btn btn-primary full" type="submit">
          Sign In
        </button>

        <div id="loginMessage" class="message"></div>

      </form>

    </div>

  </section>


  <!-- =========================
       APPLICATION
  ========================= -->

  <section id="appScreen" class="hidden">

    <header class="topbar">

      <div class="topbar-logo">

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function setMessage(id, text, type) {

      const element = document.getElementById(id);

      if (!element) {
        return;
      }

      element.className = "message " + type;
      element.textContent = text;
    }


    function clearMessage(id) {

      const element = document.getElementById(id);

      if (!element) {
        return;
      }

      element.className = "message";
      element.textContent = "";
    }


    function formatDate(value) {

      if (!value) {
        return "";
      }

      try {

        return new Date(value).toLocaleDateString(
          "en-GB"
        );

      } catch (error) {

        return value;
      }
    }

    /* =========================================================
       PHOTO PROCESSING
       
       IMPORTANT:
       - Original picture is kept for preview.
       - Original is NOT stretched.
       - A separate 300 x 300 JPEG is created.
       - The processed copy is used for the ID card.
    ========================================================= */

    async function preparePhoto(file) {

      if (!file) {
        throw new Error(
          "Please select a passport photo."
        );
      }


      if (file.size > 5 * 1024 * 1024) {

        throw new Error(
          "Photo must not be larger than 5 MB."
        );
      }


      const isJpeg =
        file.type === "image/jpeg" ||
        file.type === "image/jpg" ||
        /\.(jpe?g)$/i.test(file.name);


      if (!isJpeg) {

        throw new Error(
          "Photo must be JPEG/JPG format."
        );
      }


      const originalDataUrl =
        await readFileAsDataUrl(file);


      const image =
        await loadImage(file);


      const width =
        image.naturalWidth || image.width;

      const height =
        image.naturalHeight || image.height;


      if (!width || !height) {

        throw new Error(
          "The selected photo could not be read."
        );
      }


      const canvas =
        document.createElement("canvas");

      canvas.width = 300;
      canvas.height = 300;


      const context =
        canvas.getContext("2d");


      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";


      /*
        Centre square crop.

        This keeps the person's proportions correct.
        It never stretches a portrait into a square.
      */

      const side =
        Math.min(width, height);

      const sourceX =
        Math.floor((width - side) / 2);

      const sourceY =
        Math.floor((height - side) / 2);


      context.drawImage(
        image,
        sourceX,
        sourceY,
        side,
        side,
        0,
        0,
        300,
        300
      );


      const processedBlob =
        await canvasToJpegBlob(
          canvas,
          0.92
        );


      const processedDataUrl =
        await blobToDataUrl(
          processedBlob
        );


      return {
        originalDataUrl,
        processedDataUrl,
        sourceWidth: width,
        sourceHeight: height
      };
    }


    function readFileAsDataUrl(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onload = () =>
            resolve(reader.result);

          reader.onerror = () =>
            reject(
              new Error(
                "The selected photo could not be read."
              )
            );

          reader.readAsDataURL(file);
        }
      );
    }


    function loadImage(file) {

      return new Promise(
        (resolve, reject) => {

          const image =
            new Image();

          const url =
            URL.createObjectURL(file);


          image.onload = () => {

            URL.revokeObjectURL(url);

            resolve(image);
          };


          image.onerror = () => {

            URL.revokeObjectURL(url);

            reject(
              new Error(
                "The selected photo could not be read."
              )
            );
          };


          image.src = url;
        }
      );
    }


    function canvasToJpegBlob(canvas, quality) {

      return new Promise(
        (resolve, reject) => {

          canvas.toBlob(
            blob => {

              if (!blob) {

                reject(
                  new Error(
                    "Could not prepare the ID photo."
                  )
                );

                return;
              }

              resolve(blob);
            },
            "image/jpeg",
            quality
          );

        }
      );
    }


    function blobToDataUrl(blob) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onload =
            () => resolve(reader.result);

          reader.onerror =
            () => reject(
              new Error(
                "Could not prepare the ID photo."
              )
            );

          reader.readAsDataURL(blob);
        }
      );
    }

      document
        .getElementById("editMemberPhoto")

    async function handleEditPhoto(event) {

      const file =
        event.target.files[0];


      clearMessage(
        "editMemberMessage"
      );


      try {

        const result =
          await preparePhoto(file);


        editOriginalPhotoDataUrl =
          result.originalDataUrl;


        editProcessedPhotoDataUrl =
          result.processedDataUrl;


        const preview =
          document.getElementById(
            "editPhotoPreview"
          );


        preview.src =
          editOriginalPhotoDataUrl;


        document.getElementById(
          "editPhotoStatus"
        ).textContent =
          "✓ Original replacement preview retained • New ID photo prepared at 300 × 300 JPEG.";

      } catch (error) {

        editOriginalPhotoDataUrl =
          editingMember.photo_url || "";

        editProcessedPhotoDataUrl =
          "";


        setMessage(
          "editMemberMessage",
          error.message,
          "error"
        );
      }
    }


    async function saveMemberChanges(event) {

      event.preventDefault();

      clearMessage(
        "editMemberMessage"
      );


      if (!editingMember) {
        return;
      }


      try {

        const firstName =
          document
            .getElementById("editFirstName")
            .value.trim();


        const lastName =
          document
            .getElementById("editLastName")
            .value.trim();


        const middleName =
          document
            .getElementById("editMiddleName")
            .value.trim();


        const email =
          document
            .getElementById("editEmail")
            .value.trim();


        const phone =
          document
            .getElementById("editPhone")
            .value.trim();


        const dateOfBirth =
          document
            .getElementById("editDateOfBirth")
            .value || null;


        const address =
          document
            .getElementById("editAddress")
            .value.trim();


        const notes =
          document
            .getElementById("editNotes")
            .value.trim();


        /*
          If a replacement photo was selected,
          save the processed 300 x 300 version.

          If no replacement was selected,
          keep the existing stored photo.
        */

        const photoUrl =
          editProcessedPhotoDataUrl ||
          editingMember.photo_url ||
          null;


        const {
          error
        } = await supabaseClient.rpc(
          "update_member",
          {
            p_member_id: editingMember.id,
            p_first_name: firstName,
            p_last_name: lastName,
            p_middle_name:
              middleName || null,
            p_email:
              email || null,
            p_phone:
              phone || null,
            p_date_of_birth:
              dateOfBirth,
            p_address:
              address || null,
            p_photo_url:
              photoUrl,
            p_joined_at:
              editingMember.joined_at || null,
            p_notes:
              notes || null
          }
        );


        if (error) {
          throw error;
        }


        alert(
          "Member updated successfully."
        );


        editingMember = null;

        editOriginalPhotoDataUrl = "";
        editProcessedPhotoDataUrl = "";


        await showPage("members");

      } catch (error) {

        console.error(error);

        setMessage(
          "editMemberMessage",
          error.message ||
            "Could not update member.",
          "error"
        );
      }
    }

    async function deleteMember(memberId) {

      const member =
        membersCache.find(
          row => row.id === memberId
        );


      if (!member) {

        alert(
          "Member record could not be found."
        );

        return;
      }


      const name =
        fullName(member);


      const confirmed =
        confirm(
          "Delete member " +
          name +
          "?\n\n" +
          "This will delete the member and their membership card."
        );


      if (!confirmed) {
        return;
      }


      try {

        const {
          error
        } = await supabaseClient.rpc(
          "delete_member",
          {
            p_member_id: memberId
          }
        );


        if (error) {
          throw error;
        }


        alert(
          "Member deleted successfully."
        );


        await loadMembers();

      } catch (error) {

        console.error(error);

        alert(
          error.message ||
          "Could not delete member."
        );
      }
    }

    function renderVerify() {

      const content =
        document.getElementById(
          "pageContent"
        );


      content.innerHTML = `

        <h1 class="page-title">
          Verify
        </h1>

        <p class="page-subtitle">
          Verify a membership number or card number.
        </p>

        <div class="panel">

          <form
            id="verifyForm"
            onsubmit="verifyMember(event)"
          >

            <div class="form-group">

              <label>
                Membership or Card Number
              </label>

              <input
                id="verifyNumber"
                placeholder="MBR-2026-XXXXXX or CARD-2026-XXXXXXXX"
                required
              >

            </div>

            <div class="actions">

              <button
                class="btn btn-primary"
                type="submit"
              >
                Verify
              </button>

            </div>

          </form>

          <div
            id="verifyResult"
            class="message"
          ></div>

        </div>

      `;
    }


    async function verifyMember(event) {

      event.preventDefault();


      const number =
        document
          .getElementById(
            "verifyNumber"
          )
          .value
          .trim();


      const result =
        document.getElementById(
          "verifyResult"
        );


      result.className =
        "message";

      result.textContent =
        "Checking...";


      try {

        let member = null;


        const memberResult =
          await supabaseClient
            .from("members")
            .select("*")
            .eq(
              "membership_number",
              number
            )
            .maybeSingle();


        if (memberResult.error) {
          throw memberResult.error;
        }


        member =
          memberResult.data;


        if (!member) {

          const cardResult =
            await supabaseClient
              .from("membership_cards")
              .select("*")
              .eq(
                "card_number",
                number
              )
              .maybeSingle();


          if (cardResult.error) {
            throw cardResult.error;
          }


          if (cardResult.data) {

            const memberLookup =
              await supabaseClient
                .from("members")
                .select("*")
                .eq(
                  "id",
                  cardResult.data.member_id
                )
                .maybeSingle();


            if (memberLookup.error) {
              throw memberLookup.error;
            }


            member =
              memberLookup.data;
          }
        }


        if (!member) {

          result.className =
            "message error";

          result.textContent =
            "No matching membership record was found.";

          return;
        }


        result.className =
          "message success";

        result.innerHTML = `

          <strong>
            VERIFIED
          </strong>

          <br><br>

          Member:
          ${escapeHtml(
            fullName(member)
          )}

          <br>

          Membership Number:
          ${escapeHtml(
            member.membership_number
          )}

          <br>

          Status:
          ${escapeHtml(
            member.status || "active"
          ).toUpperCase()}

        `;

      } catch (error) {

        result.className =
          "message error";

        result.textContent =
          error.message ||
          "Verification failed.";
      }
    }
