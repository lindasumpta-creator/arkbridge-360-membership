<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arkbridge 360 Membership</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --orange: #e85d04;
      --orange-dark: #c94d00;
      --black: #111111;
      --white: #ffffff;
      --light: #f5f5f5;
      --border: #dddddd;
      --green: #16803c;
      --red: #c62828;
      --shadow: 0 8px 25px rgba(0,0,0,.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: var(--black);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #111111 0%, #222222 55%, #e85d04 100%);
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .brand-logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .brand-ab,
    .brand-gtl {
      color: #111;
      background: #fff;
    }

    .brand-360 {
      color: var(--orange);
    }

    .brand-title {
      text-align: center;
      font-weight: 700;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 9px;
      padding: 12px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(232,93,4,.12);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }

    .btn-primary:hover {
      background: var(--orange-dark);
    }

    .btn-dark {
      background: #111;
      color: white;
    }

    .btn-light {
      background: #eee;
      color: #111;
    }

    .btn-danger {
      background: var(--red);
      color: white;
    }

    .full {
      width: 100%;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      color: #a00000;
    }

    .message.success {
      display: block;
      background: #e7f8ed;
      color: #11652e;
    }

    /* APP */

    #appScreen {
      min-height: 100vh;
    }

    .topbar {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-brand {
      font-weight: 900;
      font-size: 22px;
    }

    .menu-btn {
      display: none;
      background: #111;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 62px);
    }

    .sidebar {
      width: 235px;
      background: #111;
      color: white;
      padding: 18px 12px;
      flex-shrink: 0;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: white;
      text-align: left;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      font-weight: 700;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--orange);
    }

    .main {
      flex: 1;
      padding: 22px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-title {
      font-size: 28px;
      margin: 0 0 6px;
    }

    .page-subtitle {
      color: #666;
      margin-top: 0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .stat-card {
      background: white;
      border-radius: 13px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 900;
      color: var(--orange);
    }

    .panel {
      background: white;
      border-radius: 13px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 15px;
    }

    .form-grid .full-width {
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .notice {
      padding: 12px 14px;
      background: #fff3e8;
      border-left: 4px solid var(--orange);
      border-radius: 6px;
      margin-bottom: 15px;
    }

    /* TABLE */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      border-bottom: 1px solid #eee;
      padding: 11px;
      text-align: left;
    }

    th {
      background: #f7f7f7;
    }

    /* ID CARD */

    .card-area {
      display: flex;
      justify-content: center;
      padding: 10px 0 25px;
    }

    .member-id-card {
      width: 700px;
      max-width: 100%;
      min-height: 430px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,.18);
      border: 2px solid #111;
      position: relative;
    }

    .card-top {
      height: 90px;
      background: white;
      border-bottom: 7px solid var(--orange);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 22px;
    }

    .card-brand {
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .card-brand .ab,
    .card-brand .gtl {
      color: #111;
    }

    .card-brand .three-sixty {
      color: var(--orange);
    }

    .card-heading {
      text-align: right;
    }

    .card-heading-main {
      font-weight: 900;
      font-size: 19px;
    }

    .card-heading-small {
      color: #555;
      font-size: 12px;
      margin-top: 3px;
    }

    .card-body {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 25px;
      padding: 25px;
    }

    .photo-box {
      width: 170px;
      height: 170px;
      border: 3px solid #111;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #777;
      font-weight: 700;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .member-details {
      display: grid;
      gap: 10px;
    }

    .detail-row {
      border-bottom: 1px solid #ddd;
      padding-bottom: 7px;
    }

    .detail-label {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 800;
      margin-top: 2px;
    }

    .status-active {
      display: inline-block;
      background: #16803c;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 900;
    }

    .card-footer {
      border-top: 1px solid #ddd;
      padding: 14px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #555;
    }

    .card-watermark {
      font-size: 10px;
      color: #999;
    }

    /* SUCCESS */

    .success-box {
      background: #effaf2;
      border: 1px solid #bde5c7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .success-title {
      color: #147333;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .success-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .success-item {
      background: white;
      border-radius: 8px;
      padding: 10px;
    }

    .success-label {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
    }

    .success-value {
      font-weight: 800;
      margin-top: 3px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .menu-btn {
        display: block;
      }

      .sidebar {
        position: fixed;
        left: -250px;
        top: 62px;
        bottom: 0;
        z-index: 30;
        transition: left .2s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .main {
        padding: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .full-width {
        grid-column: auto;
      }

      .card-body {
        grid-template-columns: 1fr;
      }

      .photo-box {
        margin: auto;
      }

      .card-heading {
        text-align: left;
      }

      .card-top {
        height: auto;
        gap: 10px;
        align-items: flex-start;
        flex-direction: column;
      }

      .card-footer {
        flex-direction: column;
        align-items: flex-start;
      }

      .success-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #printCard,
      #printCard * {
        visibility: visible;
      }

      #printCard {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .member-id-card {
        box-shadow: none;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen">

  <!-- APP -->
  <section id="appScreen" class="hidden">

  <script>
    const SUPABASE_URL = "https://ijcipmdvzhpfzmublwky.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7vJ5i4UwsVR-fU3HWjVapg_YQ53B8HB";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let currentPage = "dashboard";
    let latestCreatedMember = null;
    let latestPhotoDataUrl = null;

    const main = document.getElementById("main");
    const loginScreen = document.getElementById("loginScreen");
    const appScreen = document.getElementById("appScreen");
    const sidebar = document.getElementById("sidebar");


    /* -----------------------------
       BASIC HELPERS
    ----------------------------- */

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showMessage(element, text, type) {
      element.className = "message " + type;
      element.textContent = text;
    }

    async function rpc(functionName, args = {}) {
      const { data, error } = await client.rpc(functionName, args);

      if (error) {
        throw new Error(error.message || "Database request failed.");
      }

      return data;
    }


    /* -----------------------------
       AUTH
    ----------------------------- */

    async function checkSession() {
      const { data } = await client.auth.getSession();

      if (data.session) {
        showApp();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      loginScreen.classList.remove("hidden");
      appScreen.classList.add("hidden");
    }

    function showApp() {
      loginScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");
      renderPage("dashboard");
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const message = document.getElementById("loginMessage");
      message.className = "message";
      message.textContent = "";

      try {
        const { error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw error;
        }

        showApp();

      } catch (error) {
        showMessage(
          message,
          error.message || "Login failed.",
          "error"
        );
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async function() {
      await client.auth.signOut();
      showLogin();
    });


    /* -----------------------------
       NAVIGATION
    ----------------------------- */

    document.querySelectorAll(".nav-btn").forEach(button => {
      button.addEventListener("click", function() {
        const page = this.dataset.page;
        renderPage(page);
        sidebar.classList.remove("open");
      });
    });

    document.getElementById("menuBtn").addEventListener("click", function() {
      sidebar.classList.toggle("open");
    });

    function setActiveNav(page) {
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });
    }

    function renderPage(page) {
      currentPage = page;
      setActiveNav(page);

      if (page === "dashboard") renderDashboard();
      if (page === "members") renderMembers();
      if (page === "addMember") renderAddMember();
      if (page === "cards") renderCards();
      if (page === "staff") renderStaff();
      if (page === "verify") renderVerify();
      if (page === "audit") renderAudit();
    }


    /* -----------------------------
       DASHBOARD
    ----------------------------- */

    function renderDashboard() {
      main.innerHTML = `
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">
          Arkbridge 360 Membership Management
        </p>

        <div class="cards-grid">
          <div class="stat-card">
            <div class="stat-number">AB<span style="color:#e85d04">360</span>GTL</div>
            <div>Membership System</div>
          </div>

            <div>Member Registration Active</div>

      `;
    }


    /* -----------------------------
       MEMBERS
    ----------------------------- */

    async function renderMembers() {
      main.innerHTML = `
        <h1 class="page-title">Members</h1>
        <p class="page-subtitle">Registered Arkbridge 360 members</p>

        <div class="panel">
          <div id="membersStatus">Loading members...</div>

          .from("members")

          return;

            ${escapeHtml(error.message)}
          </div>
        `;
      }

    /* -----------------------------
       PHOTO VALIDATION
    ----------------------------- */

    function validatePassportPhoto(file) {
      return new Promise((resolve, reject) => {

        if (!file) {
          reject(new Error("Please select a passport photo."));
          return;
        }

        if (file.type !== "image/jpeg") {
          reject(new Error("Passport photo must be a JPEG/JPG file."));
          return;
        }

        const maxSize = 5 * 1024 * 1024;

        if (file.size > maxSize) {
          reject(new Error("Passport photo must not be larger than 5 MB."));
          return;
        }

        const image = new Image();

        image.onload = function() {
          if (image.width !== 300 || image.height !== 300) {
            reject(
              new Error(
                "Passport photo must be exactly 300 × 300 pixels."
              )
            );
            return;
          }

          resolve(image);
        };

        image.onerror = function() {
          reject(new Error("The selected photo could not be read."));
        };

        image.src = URL.createObjectURL(file);
      });
    }

       ADD MEMBER
    ----------------------------- */

                </small>

                <div id="photoMessage" class="message"></div>

                <div

                  style="

                    border:2px solid #111;

                  "
                >
                  <img
                    id="photoPreviewImage"

                  />

              </div>

              <div class="form-group full-width">
                <label for="notes">Notes</label>
                <textarea id="notes" rows="3"></textarea>
              </div>

            </div>

            <div class="actions">
              <button class="btn btn-primary" type="submit">
                Create Member & Issue Card
              </button>

              <button
                class="btn btn-light"
                type="button"
                onclick="renderPage('dashboard')"
              >
                Cancel
              </button>
            </div>

            <div id="memberMessage" class="message"></div>

          </form>

        </div>

        <div id="createdResult"></div>
      `;

      document
        .getElementById("memberPhoto")
        .addEventListener("change", handlePhotoSelection);

      document
        .getElementById("memberForm")
        .addEventListener("submit", createMember);
    }


    async function handlePhotoSelection(event) {
      const file = event.target.files[0];
      const message = document.getElementById("photoMessage");
      const preview = document.getElementById("photoPreview");
      const previewImage = document.getElementById("photoPreviewImage");

      message.className = "message";
      message.textContent = "";
      preview.style.display = "none";
      latestPhotoDataUrl = null;

      try {
        await validatePassportPhoto(file);

        const reader = new FileReader();

        reader.onload = function(e) {
          latestPhotoDataUrl = e.target.result;
          previewImage.src = latestPhotoDataUrl;
          preview.style.display = "block";

          showMessage(
            message,
            "Passport photo accepted: 300 × 300 JPEG.",
            "success"
          );
        };

        reader.readAsDataURL(file);

      } catch (error) {
        event.target.value = "";

        showMessage(
          message,
          error.message,
          "error"
        );
      }
    }


    async function createMember(event) {
      event.preventDefault();

      const message = document.getElementById("memberMessage");

      message.className = "message";
      message.textContent = "";

      try {

        if (!latestPhotoDataUrl) {
          throw new Error(
            "Please select a valid 300 × 300 JPEG passport photo before saving."
          );
        }

        const args = {
          p_membership_number: null,

          p_first_name:
            document.getElementById("first_name").value.trim(),

          p_last_name:
            document.getElementById("last_name").value.trim(),

          p_middle_name:
            document.getElementById("middle_name").value.trim() || null,

          p_email:
            document.getElementById("member_email").value.trim() || null,

          p_phone:
            document.getElementById("phone").value.trim() || null,

          p_date_of_birth:
            document.getElementById("date_of_birth").value || null,

          p_address:
            document.getElementById("address").value.trim() || null,

          p_photo_url:
            latestPhotoDataUrl,

          p_joined_at: null,

          p_notes:
            document.getElementById("notes").value.trim() || null,

          p_card_number: null,

          p_issue_date: null,

          p_expiry_date: null,

          p_card_photo_url:
            latestPhotoDataUrl,

          p_card_data: {
            photo_format: "jpeg",
            photo_width: 300,
            photo_height: 300,
            photo_max_size_mb: 5
          }
        };

        const result = await rpc(
          "create_member_and_issue_card",
          args
        );

        latestCreatedMember = result;

        showMessage(
          message,
          "Member created successfully.",
          "success"
        );

        showCreatedMember(result);

      } catch (error) {

        showMessage(
          message,
          "Member could not be created. " + error.message,
          "error"
        );
      }
    }

    function renderVerify() {

        </p>

        <div class="panel">

              Membership Number or Card Number

            <input
              id="verifyNumber"
              placeholder="Enter membership or card number"
            />
          </div>

          <button
            class="btn btn-primary"
            type="button"
            onclick="verifyMember()"
          >
            Verify
          </button>

          <div id="verifyResult" class="message"></div>

        </div>
      `;
    }


    async function verifyMember() {
      const value =
        document.getElementById("verifyNumber").value.trim();

      const resultBox =
        document.getElementById("verifyResult");

      resultBox.className = "message";
      resultBox.textContent = "";

      if (!value) {
        showMessage(
          resultBox,
          "Enter a membership number or card number.",
          "error"
        );
        return;
      }

      try {

        const { data, error } = await client
          .from("members")
          .select("*")
          .eq("membership_number", value)
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          showMessage(
            resultBox,
            "No matching member found.",
            "error"
          );
          return;
        }

        showMessage(
          resultBox,
          `Verified: ${[
            data.first_name,
            data.middle_name,
            data.last_name
          ].filter(Boolean).join(" ")} — ${data.status || "active"}`,
          "success"
        );

      } catch (error) {

        showMessage(
          resultBox,
          "Verification failed: " + error.message,
          "error"
        );
      }
    }
