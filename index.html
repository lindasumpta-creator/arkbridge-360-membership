<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arkbridge 360 Membership</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#172033;color:white;padding:16px}main{max-width:900px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}input,button,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd3df;border-radius:9px;box-sizing:border-box}button{background:#172033;color:white;border:0;font-weight:600}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav button{background:#fff;color:#172033;border:1px solid #ccd3df}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{font-size:24px;font-weight:700}.muted{color:#687386;font-size:13px}.row{display:flex;gap:8px}.row>*{flex:1}pre{white-space:pre-wrap;word-break:break-word}#msg{padding:10px;border-radius:8px}.ok{background:#e9f8ee}.err{background:#fdecec}</style></head><body><header><b>Arkbridge 360</b><div class="muted" style="color:#ccd3df">Membership & Staff Management</div></header><main><section id="login" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><div id="loginmsg"></div></section><section id="app" class="hidden"><div class="row"><button onclick="logout()">Sign out</button></div><div class="nav"><button onclick="show('dash')">Dashboard</button><button onclick="show('members')">Members</button><button onclick="show('staff')">Staff</button><button onclick="show('cards')">Cards</button><button onclick="show('verify')">Verify</button><button onclick="show('audit')">Audit</button></div><div id="dash" class="card"><h2>Dashboard</h2><div id="stats" class="grid">Loading…</div></div><div id="members" class="card hidden"><h2>Members</h2><div class="row"><input id="mq" placeholder="Search member"><button onclick="members()">Search</button></div><pre id="mout"></pre></div><div id="staff" class="card hidden"><h2>Staff</h2><div class="row"><input id="sq" placeholder="Search staff"><button onclick="staff()">Search</button></div><pre id="sout"></pre></div><div id="cards" class="card hidden"><h2>Cards</h2><div class="row"><input id="cq" placeholder="Search card/member"><button onclick="cards()">Search</button></div><pre id="cout"></pre></div><div id="verify" class="card hidden"><h2>Verify ID</h2><input id="vq" placeholder="Membership number, card number or staff ID"><button onclick="verify()">Verify</button><pre id="vout"></pre></div><div id="audit" class="card hidden"><h2>Audit</h2><button onclick="audit()">Refresh</button><pre id="aout"></pre></div></section></main><script>const URL='https://ijcipmdvzhpfzmublwky.supabase.co';const KEY='sb_publishable_7vJ5i4UwsVR-fU3HWjVapg_YQ53B8HB';const db=supabase.createClient(URL,KEY);async function login(){const{error}=await db.auth.signInWithPassword({email:email.value,password:password.value});loginmsg.textContent=error?error.message:'Signed in';if(!error)start()}async function logout(){await db.auth.signOut();start()}async function start(){const{data:{session}}=await db.auth.getSession();login.classList.toggle('hidden',!!session);app.classList.toggle('hidden',!session);if(session)loadStats()}async function rpc(name,args={}){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}async function loadStats(){try{const d=await rpc('dashboard_stats');stats.innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div class="muted">${k.replaceAll('_',' ')}</div><div class="stat">${v??0}</div></div>`).join('')}catch(e){stats.textContent=e.message}}function show(id){['dash','members','staff','cards','verify','audit'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='dash')loadStats()}async function members(){try{mout.textContent=JSON.stringify(await rpc('search_members',{p_query:mq.value,p_limit:50}),null,2)}catch(e){mout.textContent=e.message}}async function staff(){try{sout.textContent=JSON.stringify(await rpc('search_staff',{p_query:sq.value,p_limit:50}),null,2)}catch(e){sout.textContent=e.message}}async function cards(){try{cout.textContent=JSON.stringify(await rpc('search_cards',{p_query:cq.value,p_limit:50}),null,2)}catch(e){cout.textContent=e.message}}async function verify(){try{vout.textContent=JSON.stringify(await rpc('verify_identifier',{p_identifier:vq.value}),null,2)}catch(e){vout.textContent=e.message}}async function audit(){try{aout.textContent=JSON.stringify(await rpc('recent_audit_activity'),null,2)}catch(e){aout.textContent=e.message}}db.auth.onAuthStateChange(()=>start());start();</script></body></html>
