<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkbridge 360 Membership</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --orange: #e85d04;
      --black: #111111;
      --white: #ffffff;
      --light: #f4f4f4;
      --border: #dddddd;
      --green: #16803c;
      --red: #c62828;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: var(--black);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(
        135deg,
        #111111 0%,
        #222222 55%,
        #e85d04 100%
      );
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .logo-text {
      text-align: center;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .ab,
    .gtl {
      color: #111;
    }

    .three-sixty {
      color: var(--orange);
    }

    .login-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(232,93,4,.12);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 800;
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }

    .btn-dark {
      background: #111;
      color: white;
    }

    .btn-light {
      background: #e9e9e9;
      color: #111;
    }

    .btn-success {
      background: #16803c;
      color: white;
    }

    .full {
      width: 100%;
    }

    .message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .message.error {
      display: block;
      background: #ffe7e7;
      color: #a00000;
    }

    .message.success {
      display: block;
      background: #e8f8ed;
      color: #12642e;
    }

    /* =========================
       APP
    ========================= */

    .topbar {
      height: 64px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-logo {
      font-size: 23px;
      font-weight: 900;
    }

    .menu-btn {
      display: none;
      border: none;
      background: #111;
      color: white;
      border-radius: 8px;
      padding: 9px 12px;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      width: 240px;
      background: #111;
      padding: 15px 12px;
      flex-shrink: 0;
    }

    .nav-btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      background: transparent;
      color: white;
      text-align: left;
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      font-weight: 700;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--orange);
    }

    .main {
      flex: 1;
      width: 100%;
      max-width: 1400px;
      padding: 22px;
      margin: 0 auto;
    }

    .page-title {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .page-subtitle {
      margin-top: 0;
      color: #666;
    }

    .panel {
      background: white;
      border-radius: 13px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 15px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .notice {
      background: #fff2e8;
      border-left: 4px solid var(--orange);
      padding: 13px;
      border-radius: 6px;
      margin-bottom: 18px;
    }

    small {
      color: #666;
      display: block;
      margin-top: 6px;
    }

    /* =========================
       PHOTO PREVIEW
    ========================= */

    .photo-preview-wrap {
      margin-top: 14px;
      text-align: center;
    }

    .photo-preview {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border: 3px solid #111;
      border-radius: 8px;
      display: none;
      margin: auto;
    }

    /* =========================
       SUCCESS
    ========================= */

    .success-box {
      background: #effaf2;
      border: 1px solid #bde5c7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .success-title {
      color: #147333;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .success-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .success-item {
      background: white;
      padding: 10px;
      border-radius: 8px;
    }

    .success-label {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
    }

    .success-value {
      font-weight: 800;
      margin-top: 3px;
    }

    /* =========================
       ID CARD
    ========================= */

    .id-card-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0 30px;
    }

    .member-id-card {
      width: 760px;
      max-width: 100%;
      aspect-ratio: 1 / 1.52;
      background: white;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid #111;
      box-shadow: 0 18px 45px rgba(0,0,0,.18);
      position: relative;
      text-align: center;
    }

    .card-orange-top {
      height: 28px;
      background: var(--orange);
    }

    .card-logo-area {
      padding: 22px 15px 5px;
    }

    .card-logo {
      font-size: 52px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: 1px;
    }

    .card-main-title {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 900;
    }

    .card-subtitle {
      font-size: 14px;
      font-weight: 700;
      color: #555;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .card-photo-area {
      margin: 18px auto 10px;
      width: 300px;
      height: 300px;
      max-width: 70%;
      aspect-ratio: 1 / 1;
      border: 5px solid var(--orange);
      border-radius: 14px;
      overflow: hidden;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-weight: 800;
    }

    .card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .card-member-name {
      font-size: 25px;
      font-weight: 1000;
      margin: 15px 12px 10px;
      text-transform: uppercase;
    }

    .card-details {
      width: 80%;
      max-width: 590px;
      margin: auto;
    }

    .card-detail {
      display: grid;
      grid-template-columns: 1fr auto 1.5fr;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #ccc;
      text-align: left;
      font-size: 16px;
    }

    .card-detail-label {
      font-weight: 800;
    }

    .card-detail-colon {
      font-weight: 900;
    }

    .card-detail-value {
      font-weight: 800;
    }

    .active-badge {
      display: inline-block;
      background: #16803c;
      color: white;
      padding: 5px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .card-qr {
      width: 75px;
      height: 75px;
      margin: 14px auto 8px;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #777;
    }

    .card-tagline {
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 800;
      margin: 8px 10px 14px;
    }

    .card-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 75px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
    }

    .card-bottom::before {
      content: "";
      position: absolute;
      top: -25px;
      left: -5%;
      width: 110%;
      height: 45px;
      background: var(--orange);
      border-radius: 50%;
    }

    .card-bottom-name {
      position: relative;
      z-index: 2;
      margin-top: 18px;
      font-size: 17px;
      font-weight: 900;
    }

    .card-bottom-small {
      position: relative;
      z-index: 2;
      font-size: 11px;
      margin-top: 3px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f7f7f7;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .menu-btn {
        display: inline-block;
      }

      .sidebar {
        position: fixed;
        left: -250px;
        top: 64px;
        bottom: 0;
        z-index: 40;
        transition: left .2s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .main {
        padding: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }

      .success-grid {
        grid-template-columns: 1fr;
      }

      .member-id-card {
        border-radius: 14px;
      }

      .card-logo {
        font-size: 34px;
      }

      .card-main-title {
        font-size: 19px;
      }

      .card-subtitle {
        font-size: 10px;
      }

      .card-photo-area {
        width: 180px;
        height: 180px;
        margin-top: 12px;
      }

      .card-member-name {
        font-size: 16px;
        margin-top: 10px;
      }

      .card-details {
        width: 90%;
      }

      .card-detail {
        font-size: 10px;
        padding: 5px 0;
        gap: 5px;
      }

      .card-qr {
        width: 45px;
        height: 45px;
        margin: 6px auto;
      }

      .card-tagline {
        font-size: 7px;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      .card-bottom {
        height: 48px;
      }

      .card-bottom-name {
        font-size: 10px;
        margin-top: 10px;
      }

      .card-bottom-small {
        font-size: 7px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================= -->

  <section id="loginScreen">

    <div class="login-box">

      <div class="logo-text">
        <span class="ab">AB</span><span class="three-sixty">360</span><span class="gtl">GTL</span>
      </div>

      <div class="login-title">
        Arkbridge 360 Membership
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            required
            autocomplete="current-password"
          >
        </div>

        <button
          class="btn btn-primary full"
          type="submit"
        >
          Sign In
        </button>

        <div id="loginMessage" class="message"></div>

      </form>

    </div>

  </section>


  <!-- =========================
       APPLICATION
  ========================= -->

  <section id="appScreen" class="hidden">

    <header class="topbar">

      <div class="topbar-logo">
        <span class="ab">AB</span><span class="three-sixty">360</span><span class="gtl">GTL</span>
        Membership
      </div>

      <div>
        <button
          id="menuBtn"
          class="menu-btn"
          type="button"
        >
          ☰ Menu
        </button>

        <button
          id="logoutBtn"
          class="btn btn-dark"
          type="button"
        >
          Logout
        </button>
      </div>

    </header>


    <div class="layout">

      <aside id="sidebar" class="sidebar">

        <button class="nav-btn active" data-page="dashboard">
          🏠 Dashboard
        </button>

        <button class="nav-btn" data-page="members">
          👥 Members
        </button>

        <button class="nav-btn" data-page="addMember">
          ➕ Add Member
        </button>

        <button class="nav-btn" data-page="cards">
          💳 Member Cards
        </button>

        <button class="nav-btn" data-page="staff">
          👔 Staff
        </button>

        <button class="nav-btn" data-page="verify">
          🔎 Verify
        </button>

        <button class="nav-btn" data-page="audit">
          📋 Audit
        </button>

      </aside>


      <main id="main" class="main"></main>

    </div>

  </section>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://ijcipmdvzhpfzmublwky.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_7vJ5i4UwsVR-fU3HWjVapg_YQ53B8HB";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let latestPhotoDataUrl = null;
    let latestCreatedMember = null;


    const loginScreen =
      document.getElementById("loginScreen");

    const appScreen =
      document.getElementById("appScreen");

    const main =
      document.getElementById("main");

    const sidebar =
      document.getElementById("sidebar");


    /* =========================
       HELPERS
    ========================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function showMessage(
      element,
      text,
      type
    ) {

      element.className =
        "message " + type;

      element.textContent = text;
    }


    async function rpc(
      functionName,
      args = {}
    ) {

      const {
        data,
        error
      } = await client.rpc(
        functionName,
        args
      );

      if (error) {
        throw new Error(
          error.message ||
          "Database request failed."
        );
      }

      return data;
    }


    /* =========================
       AUTH
    ========================= */

    async function checkSession() {

      const {
        data
      } = await client.auth.getSession();

      if (data.session) {
        showApp();
      } else {
        showLogin();
      }
    }


    function showLogin() {

      loginScreen.classList.remove(
        "hidden"
      );

      appScreen.classList.add(
        "hidden"
      );
    }


    function showApp() {

      loginScreen.classList.add(
        "hidden"
      );

      appScreen.classList.remove(
        "hidden"
      );

      renderPage("dashboard");
    }


    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          const email =
            document
              .getElementById("loginEmail")
              .value
              .trim();

          const password =
            document
              .getElementById("loginPassword")
              .value;

          const message =
            document
              .getElementById("loginMessage");

          message.className = "message";
          message.textContent = "";

          try {

            const {
              error
            } =
              await client.auth
                .signInWithPassword({
                  email,
                  password
                });

            if (error) {
              throw error;
            }

            showApp();

          } catch (error) {

            showMessage(
              message,
              error.message ||
              "Login failed.",
              "error"
            );
          }
        }
      );


    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async function() {

          await client.auth.signOut();

          showLogin();
        }
      );


    /* =========================
       NAVIGATION
    ========================= */

    document
      .querySelectorAll(".nav-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          function() {

            renderPage(
              this.dataset.page
            );

            sidebar.classList.remove(
              "open"
            );
          }
        );
      });


    document
      .getElementById("menuBtn")
      .addEventListener(
        "click",
        function() {

          sidebar.classList.toggle(
            "open"
          );
        }
      );


    function setActiveNav(page) {

      document
        .querySelectorAll(".nav-btn")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.page === page
          );
        });
    }


    function renderPage(page) {

      setActiveNav(page);

      if (page === "dashboard") {
        renderDashboard();
      }

      if (page === "members") {
        renderMembers();
      }

      if (page === "addMember") {
        renderAddMember();
      }

      if (page === "cards") {
        renderCards();
      }

      if (page === "staff") {
        renderStaff();
      }

      if (page === "verify") {
        renderVerify();
      }

      if (page === "audit") {
        renderAudit();
      }
    }


    /* =========================
       DASHBOARD
    ========================= */

    function renderDashboard() {

      main.innerHTML = `

        <h1 class="page-title">
          Dashboard
        </h1>

        <p class="page-subtitle">
          Arkbridge 360 Membership Management
        </p>

        <div class="panel">

          <h2>
            Arkbridge 360 Membership
          </h2>

          <p>
            Register members, automatically generate
            membership numbers and card numbers,
            and produce professional member ID cards.
          </p>

          <button
            class="btn btn-primary"
            onclick="renderPage('addMember')"
          >
            Add New Member
          </button>

        </div>
      `;
    }


    /* =========================
       MEMBERS
    ========================= */

    async function renderMembers() {

      main.innerHTML = `

        <h1 class="page-title">
          Members
        </h1>

        <p class="page-subtitle">
          Registered Arkbridge 360 members.
        </p>

        <div class="panel">

          <div id="membersStatus">
            Loading members...
          </div>

          <div id="membersTable"></div>

        </div>
      `;

      try {

        const {
          data,
          error
        } =
          await client
            .from("members")
            .select("*")
            .order(
              "created_at",
              {
                ascending: false
              }
            );

        if (error) {
          throw error;
        }

        const status =
          document.getElementById(
            "membersStatus"
          );

        if (!data || data.length === 0) {

          status.textContent =
            "No members found.";

          return;
        }

        status.textContent =
          data.length +
          " member(s) found.";

        document.getElementById(
          "membersTable"
        ).innerHTML = `

          <div class="table-wrap">

            <table>

              <thead>
                <tr>
                  <th>Name</th>
                  <th>Membership Number</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody>

                ${data.map(member => `

                  <tr>

                    <td>
                      ${escapeHtml(
                        [
                          member.first_name,
                          member.middle_name,
                          member.last_name
                        ]
                        .filter(Boolean)
                        .join(" ")
                      )}
                    </td>

                    <td>
                      ${escapeHtml(
                        member.membership_number
                      )}
                    </td>

                    <td>
                      ${escapeHtml(
                        member.email || ""
                      )}
                    </td>

                    <td>
                      ${escapeHtml(
                        member.phone || ""
                      )}
                    </td>

                    <td>
                      ${escapeHtml(
                        member.status ||
                        "active"
                      )}
                    </td>

                  </tr>

                `).join("")}

              </tbody>

            </table>

          </div>
        `;

      } catch (error) {

        document.getElementById(
          "membersStatus"
        ).innerHTML = `

          <div
            class="message error"
            style="display:block"
          >
            Could not load members.<br>
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }


    /* =========================
       PHOTO VALIDATION
    ========================= */

    function validatePhoto(file) {

      return new Promise(
        (resolve, reject) => {

          if (!file) {

            reject(
              new Error(
                "Please select a passport photo."
              )
            );

            return;
          }


          if (
            file.type !==
            "image/jpeg"
          ) {

            reject(
              new Error(
                "Photo must be JPEG/JPG format."
              )
            );

            return;
          }


          const maxSize =
            5 * 1024 * 1024;


          if (file.size > maxSize) {

            reject(
              new Error(
                "Photo must not be larger than 5 MB."
              )
            );

            return;
          }


          const image =
            new Image();


          image.onload =
            function() {

              if (
                image.width !== 300 ||
                image.height !== 300
              ) {

                reject(
                  new Error(
                    "Photo must be exactly 300 × 300 pixels."
                  )
                );

                return;
              }

              resolve(image);
            };


          image.onerror =

    async function handlePhoto(event) {

      const file =
        event.target.files[0];

        document.getElementById(

        document.getElementById(
          "photoPreview"
        );


      message.className =
        "message";

      message.textContent = "";

      preview.style.display =
        "none";

      latestPhotoDataUrl = null;


      try {

        await validatePhoto(file);


        const reader =
          new FileReader();


        reader.onload =
          function(e) {

            latestPhotoDataUrl =
              e.target.result;

            preview.src =
              latestPhotoDataUrl;

            preview.style.display =
              "block";


            showMessage(
              message,
              "Photo accepted: 300 × 300 JPEG.",
              "success"
            );
          };


        reader.readAsDataURL(file);


      } catch (error) {

        event.target.value = "";

        showMessage(
          message,
          error.message,
          "error"
        );
      }
    }

    /* =========================
       CREATE JPEG
    ========================= */

    async function createCardJpeg() {

      const card =
        document.getElementById(
          "memberCard"
        );

      if (!card) {

        throw new Error(
          "Member ID card is not available."
        );
      }


      const canvas =
        document.createElement(
          "canvas"
        );


      const scale = 2;

      const width =
        card.offsetWidth *
        scale;

      const height =
        card.offsetHeight *
        scale;


      canvas.width = width;
      canvas.height = height;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#ffffff";

      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      /*
        Use the browser's built-in
        SVG foreignObject rendering
        to preserve the complete
        centered card design.
      */

      const serialized =
        new XMLSerializer()
          .serializeToString(card);


      const svg = `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="${width}"
          height="${height}"
        >
          <foreignObject
            width="100%"
            height="100%"
          >
            <div
              xmlns="http://www.w3.org/1999/xhtml"
              style="
                width:${width}px;
                height:${height}px;
                transform:scale(${scale});
                transform-origin:top left;
              "
            >
              ${serialized}
            </div>
          </foreignObject>
        </svg>
      `;


      const blob =
        new Blob(
          [svg],
          {
            type:
              "image/svg+xml;charset=utf-8"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const image =
        new Image();


      await new Promise(
        (resolve, reject) => {

          image.onload =
            resolve;

          image.onerror =
            reject;

          image.src =
            url;
        }
      );


      ctx.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      URL.revokeObjectURL(
        url
      );


      return new Promise(
        resolve => {

          canvas.toBlob(
            blob => {

              resolve(blob);

            },
            "image/jpeg",
            0.95
          );
        }
      );
    }


    /* =========================

    ========================= */

    async function downloadMemberCardJpeg() {

      try {

        const jpeg =
          await createCardJpeg();


        const name =
          latestCreatedMember
            ?.member
            ?.membership_number ||
          "arkbridge-360-member-card";


        const url =
          URL.createObjectURL(
            jpeg
          );


        const link =
          document.createElement(
            "a"
          );


        link.href = url;

        link.download =
          name +
          "-ID-card.jpg";


        document.body.appendChild(
          link
        );

        link.click();

        link.remove();


        setTimeout(
          () =>
            URL.revokeObjectURL(
              url
            ),
          1000
        );


        showShareMessage(
          "ID card JPEG created and downloaded.",
          "success"
        );


      } catch (error) {

        showShareMessage(
          "Could not create JPEG: " +
          error.message,
          "error"
        );
      }
    }


    /* =========================
       SHARE JPEG
    ========================= */

    async function shareMemberCardJpeg() {

      try {

        const jpeg =
          await createCardJpeg();


        const membershipNumber =
          latestCreatedMember
            ?.member
            ?.membership_number ||
          "member";


        const file =
          new File(
            [
              jpeg
            ],
            membershipNumber +
            "-ID-card.jpg",
            {
              type:
                "image/jpeg"
            }
          );


        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          await navigator.share({

            title:
              "Arkbridge 360 Membership ID Card",

            text:
              "Arkbridge 360 Membership ID Card",

            files: [
              file
            ]
          });


          showShareMessage(
            "ID card JPEG is ready to share.",
            "success"
          );

          return;
        }


        /*
          Some phones/browsers do not allow
          direct file sharing through the Web Share API.
          In that case download the JPEG first.
        */

        const url =
          URL.createObjectURL(
            jpeg
          );


        const link =
          document.createElement(
            "a"
          );


        link.href = url;

        link.download =
          membershipNumber +
          "-ID-card.jpg";


        document.body.appendChild(
          link
        );

        link.click();

        link.remove();


        setTimeout(
          () =>
            URL.revokeObjectURL(
              url
            ),
          1000
        );


        showShareMessage(
          "Your phone does not support direct JPEG sharing. The card JPEG has been downloaded. Open WhatsApp and attach the downloaded JPEG.",
          "success"
        );


      } catch (error) {

        if (
          error.name ===
          "AbortError"
        ) {
          return;
        }


        showShareMessage(
          "Could not share JPEG: " +
          error.message,
          "error"
        );
      }
    }

      showMessage(

      );
    }

    async function verifyMember() {

      const value =
        document
          .getElementById(
            "verifyNumber"
          )
          .value
          .trim();


      const resultBox =
        document.getElementById(
          "verifyResult"
        );


      resultBox.className =
        "message";

      resultBox.textContent = "";


      if (!value) {

        showMessage(
          resultBox,
          "Enter a membership number.",
          "error"
        );

        return;
      }


      try {

        const {
          data,
          error
        } =
          await client
            .from("members")
            .select("*")
            .eq(
              "membership_number",
              value
            )
            .maybeSingle();


        if (error) {
          throw error;
        }


        if (!data) {

          showMessage(
            resultBox,
            "No matching member found.",
            "error"
          );

          return;
        }


        const name =
          [
            data.first_name,
            data.middle_name,
            data.last_name
          ]
          .filter(Boolean)
          .join(" ");


        showMessage(
          resultBox,
          "Verified: " +
          name +
          " — " +
          (
            data.status ||
            "active"
          ),
          "success"
        );


      } catch (error) {

        showMessage(
          resultBox,
          "Verification failed: " +
          error.message,
          "error"
        );
      }
    }
